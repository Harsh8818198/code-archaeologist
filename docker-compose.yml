version: "3"

services:
  postgres:
    image: postgres:15
    container_name: code-archaeologist-postgres
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kestra:
    image: kestra/kestra:latest
    container_name: code-archaeologist-kestra
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            username: kestra
            password: k3str4
        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
    ports:
      - "8080:8080"
    volumes:
      - kestra-data:/app/storage
      - ./kestra-flows:/app/flows
    depends_on:
      - postgres

volumes:
  postgres-data:
  kestra-data:
